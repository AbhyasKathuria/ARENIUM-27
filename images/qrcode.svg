<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="qrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#07060f" rx="16"/>
  <rect x="15" y="15" width="370" height="370" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="10, 5" opacity="0.6"/>

  <!-- Corner Reticles -->
  <path d="M 30,60 L 30,30 L 60,30" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <path d="M 340,30 L 370,30 L 370,60" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <path d="M 30,340 L 30,370 L 60,370" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <path d="M 340,370 L 370,370 L 370,340" fill="none" stroke="#00f0ff" stroke-width="4"/>

  <!-- QR Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- TL -->
  <rect x="50" y="50" width="80" height="80" rx="10" fill="none" stroke="#00f0ff" stroke-width="8" filter="url(#qrGlow)"/>
  <rect x="70" y="70" width="40" height="40" rx="4" fill="#00f0ff"/>

  <!-- TR -->
  <rect x="270" y="50" width="80" height="80" rx="10" fill="none" stroke="#ff0055" stroke-width="8" filter="url(#qrGlow)"/>
  <rect x="290" y="70" width="40" height="40" rx="4" fill="#ff0055"/>

  <!-- BL -->
  <rect x="50" y="270" width="80" height="80" rx="10" fill="none" stroke="#00f0ff" stroke-width="8" filter="url(#qrGlow)"/>
  <rect x="70" y="290" width="40" height="40" rx="4" fill="#00f0ff"/>

  <!-- Simulated Cyber Data Grid Elements -->
  <g fill="#00f0ff" opacity="0.9">
    <rect x="150" y="50" width="16" height="16" rx="2"/>
    <rect x="180" y="50" width="32" height="16" rx="2"/>
    <rect x="230" y="50" width="16" height="32" rx="2"/>
    <rect x="150" y="80" width="32" height="16" rx="2"/>
    <rect x="200" y="80" width="16" height="16" rx="2"/>
    <rect x="150" y="114" width="16" height="32" rx="2"/>
    <rect x="180" y="114" width="48" height="16" rx="2"/>
    <rect x="240" y="100" width="16" height="48" rx="2"/>
  </g>

  <g fill="#ff0055" opacity="0.85">
    <rect x="50" y="150" width="16" height="48" rx="2"/>
    <rect x="80" y="150" width="32" height="16" rx="2"/>
    <rect x="114" y="180" width="48" height="16" rx="2"/>
    <rect x="80" y="210" width="16" height="32" rx="2"/>
    <rect x="50" y="230" width="32" height="16" rx="2"/>
    <rect x="114" y="230" width="16" height="16" rx="2"/>
  </g>

  <g fill="#ffffff" opacity="0.95">
    <rect x="270" y="150" width="32" height="16" rx="2"/>
    <rect x="320" y="150" width="30" height="32" rx="2"/>
    <rect x="290" y="180" width="16" height="32" rx="2"/>
    <rect x="270" y="230" width="48" height="16" rx="2"/>
    <rect x="330" y="220" width="20" height="26" rx="2"/>
    <rect x="150" y="270" width="48" height="16" rx="2"/>
    <rect x="210" y="270" width="16" height="48" rx="2"/>
    <rect x="150" y="300" width="32" height="32" rx="2"/>
    <rect x="190" y="334" width="32" height="16" rx="2"/>
    <rect x="240" y="290" width="32" height="16" rx="2"/>
    <rect x="290" y="270" width="16" height="32" rx="2"/>
    <rect x="320" y="280" width="30" height="30" rx="2"/>
    <rect x="250" y="334" width="48" height="16" rx="2"/>
    <rect x="320" y="334" width="30" height="16" rx="2"/>
  </g>

  <!-- Center Badge / Arenium Core -->
  <rect x="150" y="150" width="100" height="100" rx="14" fill="#07060f" stroke="url(#qrGrad)" stroke-width="4" filter="url(#qrGlow)"/>
  <circle cx="200" cy="200" r="32" fill="#0d0b1a" stroke="#00f0ff" stroke-width="2"/>
  <text x="200" y="196" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#00f0ff" text-anchor="middle">ARENIUM</text>
  <text x="200" y="215" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#ff0055" text-anchor="middle">'27</text>
  <text x="200" y="232" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffe600" text-anchor="middle">SOIS // BENGALURU</text>

  <!-- Cyber Sub-grid Lines -->
  <line x1="30" y1="200" x2="135" y2="200" stroke="#00f0ff" stroke-dasharray="2, 6" opacity="0.4"/>
  <line x1="265" y1="200" x2="370" y2="200" stroke="#ff0055" stroke-dasharray="2, 6" opacity="0.4"/>
</svg>
