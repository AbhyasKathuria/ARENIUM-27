<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#080612"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <filter id="glowEv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#evBg)"/>
  
  <!-- Outer frame -->
  <rect x="20" y="20" width="860" height="560" rx="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Top bar -->
  <rect x="20" y="20" width="860" height="8" fill="url(#neonBar)"/>
  
  <!-- Title section -->
  <text x="50" y="70" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#glowEv)">
    ARENIUM'27 // <tspan fill="#00f0ff">EVENT MATRIX</tspan>
  </text>
  <text x="50" y="95" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#9aa4c2">
    SOIS · COMPETE, CONQUER &amp; TRANSCEND
  </text>

  <!-- Left Column: PRE-EVENTS -->
  <g transform="translate(50, 130)">
    <rect width="370" height="400" rx="6" fill="#06050e" stroke="#ff0055" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="45" rx="6" fill="rgba(255, 0, 85, 0.15)"/>
    <text x="20" y="30" font-family="'Orbitron', sans-serif" font-size="16" font-weight="800" fill="#ff0055">
      [01] PRE-EVENTS
    </text>
    
    <!-- Item 1 -->
    <g transform="translate(20, 65)">
      <circle cx="6" cy="14" r="4" fill="#00f0ff"/>
      <text x="24" y="18" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff">CYBERPUNK PHOTOGRAPHY</text>
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">Theme: Neon Nightscapes &amp; Tech Horizons</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 135)">
      <circle cx="6" cy="14" r="4" fill="#00f0ff"/>
      <text x="24" y="18" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff">REEL MAKING CONTEST</text>
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">60-sec creative short video challenge</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 205)">
      <circle cx="6" cy="14" r="4" fill="#ffe600"/>
      <text x="24" y="18" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#ffffff">ONLINE DIGITAL ART</text>
      <text x="24" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">Original concept art &amp; futuristic 3D renders</text>
    </g>
    
    <rect x="20" y="290" width="330" height="80" rx="4" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.3)" stroke-dasharray="4,4"/>
    <text x="185" y="325" font-family="'Orbitron', sans-serif" font-size="12" font-weight="700" fill="#00f0ff" text-anchor="middle">SUBMISSIONS OPEN NATIONWIDE</text>
    <text x="185" y="348" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9aa4c2" text-anchor="middle">Online screening &amp; Instagram features</text>
  </g>

  <!-- Right Column: MAIN EVENTS -->
  <g transform="translate(480, 130)">
    <rect width="370" height="400" rx="6" fill="#06050e" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="45" rx="6" fill="rgba(0, 240, 255, 0.15)"/>
    <text x="20" y="30" font-family="'Orbitron', sans-serif" font-size="16" font-weight="800" fill="#00f0ff">
      [02] ON-CAMPUS MAIN EVENTS
    </text>

    <!-- Event bullets -->
    <g transform="translate(20, 65)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ffe600">⚡ TECH QUIZ ARENA</text>
      <text x="160" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Rapid MCQ &amp; Buzzer</text>
    </g>

    <g transform="translate(20, 105)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#00f0ff">🎮 LAN GAMING CHAMPIONSHIP</text>
      <text x="220" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Valorant / BGMI</text>
    </g>

    <g transform="translate(20, 145)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ff0055">🔍 QR CAMPUS TREASURE HUNT</text>
      <text x="235" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Cryptic Clues</text>
    </g>

    <g transform="translate(20, 185)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ffe600">🏎️ RETRO RACING SIMULATOR</text>
      <text x="220" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Time-Trial Dash</text>
    </g>

    <g transform="translate(20, 225)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#00f0ff">🎭 EMOJI-CHARADES CHALLENGE</text>
      <text x="240" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Team Decrypt</text>
    </g>

    <g transform="translate(20, 265)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#ff0055">🤖 AI MEME BATTLE</text>
      <text x="160" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Prompt Engineering &amp; Humor</text>
    </g>

    <g transform="translate(20, 305)">
      <text x="0" y="16" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#00f0ff">♻️ E-WASTE SCULPTURE &amp; ART</text>
      <text x="230" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9aa4c2">| Upcycled Cyber Tech</text>
    </g>

    <text x="185" y="375" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffe600" text-anchor="middle">
      + MORE EXCLUSIVE SURPRISE CHALLENGES
    </text>
  </g>
</svg>
